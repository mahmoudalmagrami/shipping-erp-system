version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shipping_erp_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: shipping_user
      POSTGRES_PASSWORD: shipping_pass_2026
      POSTGRES_DB: shipping_erp
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
